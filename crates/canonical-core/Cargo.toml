[package]
name = "canonical-core"
version.workspace = true
edition.workspace = true

[dependencies]
string-interner = "0.19.0"
rayon = "1.10.0"
mimalloc = { version = "0.1.43", optional = true }
arc-swap = "1.7.1"
once_cell = "1.20.3"
thread_local_collect = "1.0.1"
rustc-hash = "2.1.1"
stacker = "0.1.23"
# The model runs on wgpu's GPU, through Metal, Vulkan or DX12, or on NdArray if it has none.
burn = { version = "0.21.0", default-features = false, features = ["std", "dispatch", "ndarray", "webgpu"] }
# The burn-onnx generated code loads its weights through `burn_store`.
burn-store = "0.21.0"

[build-dependencies]
burn-onnx = "0.21.0"

[features]
# Global allocator. Exactly one of these should be on:
#  - `mimalloc`: bundle the mimalloc crate (standalone binaries).
#  - `host-mimalloc`: call the `mi_*` functions of the process that loads us
#    (the Lean cdylib: Lean ships mimalloc, and `lean_alloc_small_object` must
#    use the same heap Lean frees from).
# Neither: the system allocator.
mimalloc = ["dep:mimalloc"]
host-mimalloc = []
